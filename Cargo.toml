[package]
name = "alm"
version = "0.1.0"
edition = "2024"

[dependencies]
logos = "0.16.1"

[lib]
name = "alm_rt"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "alm"
path = "src/main.rs"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
# The rt alignment laws ride debug_assert! — keep them live in release so
# every corpus run and `cargo test --release` leg validates them (an assert
# trip aborts loud under panic=abort; the battery reports it as a run
# failure). The alignment is pure; this keeps proving it.
debug-assertions = true
